[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-data-engineering-customer-intelligence"
version = "1.0.0"
description = "End-to-end synthetic banking data engineering and customer intelligence portfolio project"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["src*"]
